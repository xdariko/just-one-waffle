# Веб-сборка игры (WebGL) и выкладка на GitHub Pages.
# Запускается на каждый пуш в main и вручную (Actions → Web build → Run workflow).
# Нужные секреты репозитория: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD — см. Docs/WebBuild.md
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Новый пуш отменяет ещё не законченную сборку
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Образ Unity весит ~7 ГБ, на стандартном раннере без чистки может не хватить места
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          tool-cache: false

      - uses: actions/checkout@v4

      # Library — кэш импорта ассетов; без него каждая сборка импортирует проект заново
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: just-one-waffle
          # Версию берём из Player Settings, а не из git-тегов
          versioning: None

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/just-one-waffle

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
